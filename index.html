<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>コラージュメーカー</title>

  <!-- html2canvas: キャンバスへの書き出しに使用 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ===================================
       CSS カスタムプロパティ（変数）定義
       =================================== */
    :root {
      --primary: #1a73e8;
      --primary-hover: #1558b0;
      --surface: #ffffff;
      --surface-2: #f8f9fa;
      --surface-3: #f1f3f4;
      --border: #e0e0e0;
      --text: #202124;
      --text-secondary: #5f6368;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.14), 0 4px 8px rgba(0,0,0,0.10);
      --radius: 12px;
      --radius-sm: 8px;
      --gap: 4px; /* コラージュのコマ間隔 */
      --border-size: 0px; /* 枠線の太さ */
      --border-color: #ffffff; /* 枠線の色（＝背景色と同じにすると見えない） */
      --bg-color: #ffffff; /* コラージュ背景色 */
    }

    /* ===================================
       リセット & ベーススタイル
       =================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Hiragino Kuchi Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #f0f2f5;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===================================
       ヘッダー
       =================================== */
    .header {
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: auto;
    }

    /* ===================================
       メインレイアウト
       =================================== */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ===================================
       カードコンポーネント
       =================================== */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .card-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--surface-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .card-body {
      padding: 20px;
    }

    /* ===================================
       ドロップゾーン（画像アップロードエリア）
       =================================== */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--surface-2);
      position: relative;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--primary);
      background: #e8f0fe;
      transform: scale(1.005);
    }

    .drop-zone-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.7;
    }

    .drop-zone-text {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .drop-zone-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    /* ===================================
       ボタンスタイル
       =================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 100px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: var(--shadow-md);
    }

    .btn-secondary {
      background: var(--surface-3);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }

    .btn-outline:hover {
      background: #e8f0fe;
    }

    .btn-danger {
      background: #fce8e6;
      color: #c5221f;
    }

    .btn-danger:hover {
      background: #f5c6c4;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ===================================
       アップロード済み画像のサムネイル一覧
       =================================== */
    .thumbnail-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .thumbnail-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .thumbnail-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* サムネイルの削除ボタン */
    .thumbnail-remove {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.15s;
    }

    .thumbnail-remove:hover {
      background: rgba(200, 0, 0, 0.75);
    }

    /* アップロード枚数バッジ */
    .upload-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 12px;
    }

    .count-badge {
      background: var(--primary);
      color: #fff;
      border-radius: 100px;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ===================================
       レイアウト選択グリッド
       =================================== */
    .layout-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 8px;
    }

    .layout-btn {
      aspect-ratio: 4/3;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      background: var(--surface-2);
      transition: all 0.15s;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 3px;
    }

    .layout-btn:hover {
      border-color: var(--primary);
      background: #e8f0fe;
    }

    .layout-btn.active {
      border-color: var(--primary);
      background: #e8f0fe;
      box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
    }

    /* レイアウトのプレビューSVG内のスタイル */
    .layout-btn svg {
      width: 100%;
      height: 100%;
    }

    .layout-label {
      font-size: 9px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.2;
    }

    .layout-btn.active .layout-label {
      color: var(--primary);
      font-weight: 600;
    }

    /* ===================================
       コラージュエリア本体
       =================================== */
    .collage-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 8px 0;
    }

    /* 実際にダウンロードされる領域 */
    #collage-area {
      position: relative;
      background: var(--bg-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      /* JS で width/height を設定 */
    }

    /* コラージュのコマ（セル）コンテナ */
    .collage-grid {
      width: 100%;
      height: 100%;
      display: grid;
      gap: var(--gap);
      padding: var(--gap);
      background: var(--bg-color);
    }

    /* 各コマ（セル） */
    .collage-cell {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      cursor: grab;
      border: var(--border-size) solid var(--border-color);
      /* ドラッグ中の視覚フィードバック */
      transition: box-shadow 0.2s, opacity 0.15s;
    }

    .collage-cell:active {
      cursor: grabbing;
    }

    /* ドラッグオーバー時のハイライト */
    .collage-cell.drag-target {
      box-shadow: inset 0 0 0 3px var(--primary);
    }

    /* ドラッグ中のセル */
    .collage-cell.dragging {
      opacity: 0.5;
    }

    /* セル内部の画像コンテナ
       ここに object-fit: cover 的な動作をJS+CSSで再現する */
    .cell-image-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      /* ユーザーが画像をドラッグして位置調整できるようにする */
      cursor: grab;
    }

    .cell-image-container:active {
      cursor: grabbing;
    }

    /* コマ内の画像本体
       transformで位置・スケールを制御する */
    .cell-image {
      position: absolute;
      /* サイズはJSで設定する */
      user-select: none;
      pointer-events: none; /* 画像自体のドラッグをブロック（コンテナで処理） */
      transition: none; /* 動きはリアルタイムで */
      transform-origin: 0 0;
    }

    /* セルが空のとき（ガイド表示） */
    .cell-empty {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface-3);
      color: var(--text-secondary);
      font-size: 13px;
      gap: 8px;
    }

    /* コマのオーバーレイ（ホバー時に表示するコントロール） */
    .cell-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      transition: background 0.2s;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 6px;
      pointer-events: none;
      z-index: 10;
    }

    .collage-cell:hover .cell-overlay {
      background: rgba(0,0,0,0.18);
      pointer-events: auto;
    }

    .cell-controls {
      display: flex;
      gap: 4px;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.2s;
    }

    .collage-cell:hover .cell-controls {
      opacity: 1;
      transform: translateY(0);
    }

    /* セルコントロールボタン */
    .cell-ctrl-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: var(--text);
      border: none;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: background 0.15s, transform 0.15s;
    }

    .cell-ctrl-btn:hover {
      background: #fff;
      transform: scale(1.1);
    }

    /* ===================================
       拡大・位置調整パネル（モーダル風）
       =================================== */
    .edit-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.14);
      padding: 16px 20px 32px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 200;
      max-height: 70vh;
      overflow-y: auto;
    }

    .edit-panel.open {
      transform: translateY(0);
    }

    .edit-panel-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .edit-panel-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 16px;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .slider-value {
      color: var(--primary);
      font-weight: 600;
      font-size: 12px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--surface-3);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    /* ===================================
       設定パネル（背景色・余白・枠線など）
       =================================== */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .color-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .color-swatch.active {
      border-color: var(--primary);
      transform: scale(1.15);
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    select, input[type="color"] {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      outline: none;
      width: 100%;
      cursor: pointer;
    }

    select:focus, input[type="color"]:focus {
      border-color: var(--primary);
    }

    input[type="color"] {
      height: 36px;
      padding: 2px 4px;
    }

    /* トグルスイッチ */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .toggle input:checked + .toggle-slider {
      background: var(--primary);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(18px);
    }

    /* ===================================
       ダウンロードボタンエリア
       =================================== */
    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ===================================
       ガイドエリア（画像未選択時）
       =================================== */
    .guide-area {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .guide-icon {
      font-size: 56px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .guide-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .guide-desc {
      font-size: 14px;
      line-height: 1.6;
    }

    /* ===================================
       進捗・エラーメッセージ
       =================================== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(32,33,36,0.9);
      color: #fff;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 13px;
      z-index: 999;
      transition: transform 0.3s ease, opacity 0.3s;
      opacity: 0;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ===================================
       オーバーレイ（編集パネル背景）
       =================================== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 199;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===================================
       レスポンシブ
       =================================== */
    @media (max-width: 600px) {
      .header-subtitle { display: none; }
      .settings-grid { grid-template-columns: 1fr; }
      .action-bar { justify-content: center; }
      .layout-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
    }

    /* ===================================
       出力アスペクト比ラジオボタン
       =================================== */
    .ratio-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ratio-btn {
      padding: 5px 12px;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      font-size: 12px;
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s;
    }

    .ratio-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .ratio-btn:hover:not(.active) {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* セパレーター */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }
  </style>
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header class="header">
  <div class="header-logo"></div>
  <h1 class="header-title">コラージュメーカー</h1>
  <span class="header-subtitle">2〜4枚の写真でコラージュを作成</span>
</header>

<!-- ===== メインコンテンツ ===== -->
<main class="main">

  <!-- ① 画像アップロードカード -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon">📷</div>
      <span class="card-title">写真を選択</span>
    </div>
    <div class="card-body">

      <!-- ドロップゾーン -->
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">🖼️</div>
        <div class="drop-zone-text">ここに写真をドラッグ＆ドロップ</div>
        <div class="drop-zone-sub">JPG・PNG・WEBP対応 ／ 2〜4枚まで</div>
        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
          📁 ファイルを選択
        </button>
        <!-- ファイル選択（非表示の input） -->
        <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp" style="display:none">
      </div>

      <!-- アップロード済みサムネイル -->
      <div id="thumbnailArea" style="display:none">
        <div class="upload-count">
          <span>選択済み：</span>
          <span class="count-badge" id="countBadge">0</span>
          <span>枚 / 最大4枚</span>
          <button class="btn btn-sm btn-danger" style="margin-left:auto" onclick="clearAllImages()">
            🗑️ すべて削除
          </button>
        </div>
        <div class="thumbnail-list" id="thumbnailList"></div>
      </div>

    </div>
  </div>

  <!-- ② レイアウト選択カード -->
  <div class="card" id="layoutCard" style="display:none">
    <div class="card-header">
      <div class="card-icon">⊞</div>
      <span class="card-title">レイアウト</span>
    </div>
    <div class="card-body">
      <div class="layout-grid" id="layoutGrid">
        <!-- JSで動的に生成 -->
      </div>
    </div>
  </div>

  <!-- ③ コラージュプレビューカード -->
  <div class="card" id="collageCard" style="display:none">
    <div class="card-header">
      <div class="card-icon">✨</div>
      <span class="card-title">コラージュプレビュー</span>
    </div>

// =========================================================
// 初期化
// =========================================================
window.addEventListener('DOMContentLoaded', () => {
  initDropZone();
  initFileInput();
  updateGap('3'); // デフォルトのギャップ
});

// =========================================================
// ファイル入力 / ドラッグ＆ドロップ
// =========================================================

/** ドロップゾーンの初期化 */
function initDropZone() {
  const zone = document.getElementById('dropZone');

  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    zone.classList.add('drag-over');
  });

  zone.addEventListener('dragleave', () => {
    zone.classList.remove('drag-over');
  });

  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    handleFiles(Array.from(e.dataTransfer.files));
  });
}

/** ファイル入力 input の初期化 */
function initFileInput() {
  const input = document.getElementById('fileInput');
  input.addEventListener('change', (e) => {
    handleFiles(Array.from(e.target.files));
    input.value = ''; // 同じファイルを再選択できるようリセット
  });
}

/**
 * ファイルを受け取り、画像として登録する
 * ObjectURL はセキュリティポリシーでブロックされる環境があるため
 * FileReader で Base64 DataURL に変換して保持する
 * @param {File[]} files
 */
function handleFiles(files) {
  // 画像ファイルのみフィルタ
  const imageFiles = files.filter(f => f.type.startsWith('image/'));

  if (imageFiles.length === 0) {
    showToast('画像ファイルを選択してください（JPG・PNG・WEBP）');
    return;
  }

  const remaining = 4 - images.length;
  if (remaining <= 0) {
    showToast('画像は最大4枚までです');
    return;
  }

  // 追加可能な枚数だけ処理
  const toAdd = imageFiles.slice(0, remaining);
  let loaded = 0;

  toAdd.forEach(file => {
    const reader = new FileReader();

    reader.onload = (e) => {
      // Base64 DataURL として保持（ObjectURL より互換性が高い）
      const dataUrl = e.target.result;
      images.push({ file, url: dataUrl, name: file.name });

      // 変換情報の初期値
      cellTransforms.push({ scale: 1, offsetX: 0, offsetY: 0 });

      loaded++;
      // 全ファイルの読み込みが完了したら UI を更新
      if (loaded === toAdd.length) {
        onImagesUpdated();
      }
    };

    reader.onerror = () => {
      showToast(`エラー: ${file.name} の読み込みに失敗しました`);
      loaded++;
      if (loaded === toAdd.length) {
        onImagesUpdated();
      }
    };

    // ファイルを Base64 として読み込む
    reader.readAsDataURL(file);
  });

  if (imageFiles.length > remaining) {
    showToast(`${imageFiles.length}枚選択されましたが、${toAdd.length}枚のみ追加しました`);
  }
}

/** 画像リストが更新されたときのUI更新 */
function onImagesUpdated() {
  const count = images.length;

  // サムネイル表示エリア
  const thumbArea = document.getElementById('thumbnailArea');
  const thumbList = document.getElementById('thumbnailList');
  const countBadge = document.getElementById('countBadge');

  if (count === 0) {
    thumbArea.style.display = 'none';
    document.getElementById('layoutCard').style.display = 'none';
    document.getElementById('collageCard').style.display = 'none';
    document.getElementById('settingsCard').style.display = 'none';
    document.getElementById('downloadCard').style.display = 'none';
    return;
  }

  // サムネイルを再描画
  thumbArea.style.display = '';
  countBadge.textContent = count;
  thumbList.innerHTML = '';

  images.forEach((img, i) => {
    const item = document.createElement('div');
    item.className = 'thumbnail-item';
    item.innerHTML = `
      <img src="${img.url}" alt="写真${i+1}">
      <button class="thumbnail-remove" onclick="removeImage(${i})" title="削除">✕</button>
    `;
    thumbList.appendChild(item);
  });

  // 2枚以上でコラージュ機能を表示
  if (count >= 2) {
    document.getElementById('layoutCard').style.display = '';
    document.getElementById('collageCard').style.display = '';
    document.getElementById('settingsCard').style.display = '';
    document.getElementById('downloadCard').style.display = '';

    // レイアウト選択肢を更新
    renderLayoutOptions(count);

    // レイアウトが未設定、または枚数が変わった場合はデフォルトを設定
    if (!currentLayout || currentLayout.count !== count) {
      const defaults = layoutDefs[count];
      if (defaults) {
        selectLayout(defaults[0], count);
      }
    } else {
      // 枚数は変わっていないが画像が変わったので再描画
      renderCollage();
    }
  }
}

/** 特定の画像を削除 */
function removeImage(index) {
  // Base64 DataURL のため revoke 不要
  images.splice(index, 1);
  cellTransforms.splice(index, 1);
  currentLayout = null; // レイアウトをリセット
  onImagesUpdated();
}

/** 全画像を削除 */
function clearAllImages() {
  // Base64 DataURL のため revoke 不要
  images = [];
  cellTransforms = [];
  currentLayout = null;
  onImagesUpdated();
}

// =========================================================
// レイアウト選択
// =========================================================

/**
 * レイアウト選択ボタンを描画する
 * @param {number} count 画像枚数
 */
function renderLayoutOptions(count) {
  const grid = document.getElementById('layoutGrid');
  grid.innerHTML = '';

  const layouts = layoutDefs[count];
  if (!layouts) return;

  layouts.forEach((layout, idx) => {
    const btn = document.createElement('button');
    btn.className = 'layout-btn' + (currentLayout && currentLayout.id === layout.id ? ' active' : '');
    btn.innerHTML = `${layout.svg}<span class="layout-label">${layout.label}</span>`;
    btn.onclick = () => selectLayout(layout, count);
    grid.appendChild(btn);
  });
}

/**
 * レイアウトを選択してコラージュを描画する
 * @param {object} layout レイアウト設定オブジェクト
 * @param {number} count 画像枚数
 */
function selectLayout(layout, count) {
  currentLayout = { ...layout, count };

  // アクティブクラスの切り替え
  document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.querySelector('.layout-label')?.textContent === layout.label) {
      btn.classList.add('active');
    }
  });

  renderCollage();
}

// =========================================================
// コラージュ描画
// =========================================================

/**
 * コラージュエリアを現在の設定で描画する
 * レイアウト・画像・変換情報をもとに DOM を構築する
 */
function renderCollage() {
  if (!currentLayout || images.length < 2) return;

  const area = document.getElementById('collage-area');
  area.innerHTML = '';

  // アスペクト比の計算
  const [rw, rh] = currentRatio.split(':').map(Number);
  const ratio = rh / rw;

  // 表示サイズの決定（スマホでははみ出ないようにする）
  const maxW = Math.min(COLLAGE_DISPLAY_SIZE, window.innerWidth - 64);
  const displayW = maxW;
  const displayH = Math.round(displayW * ratio);

  area.style.width = displayW + 'px';
  area.style.height = displayH + 'px';

  // グリッドコンテナ
  const grid = document.createElement('div');
  grid.className = 'collage-grid';
  grid.style.gridTemplateAreas = currentLayout.template;
  grid.style.gridTemplateColumns = currentLayout.cols;
  grid.style.gridTemplateRows = currentLayout.rows;

  // テンプレート文字列からセル文字（a,b,c,d）を取得
  const cellLetters = [...new Set(currentLayout.template.match(/[a-d]/g) || [])].sort();

  cellLetters.forEach((letter, index) => {
    const cell = document.createElement('div');
    cell.className = 'collage-cell';
    cell.style.gridArea = letter;
    cell.dataset.index = index;

    if (images[index]) {
      // 画像セルを作成
      createImageCell(cell, index);
    } else {
      // 空セル（通常は発生しないが念のため）
      cell.innerHTML = `<div class="cell-empty"><span>＋</span><span>画像なし</span></div>`;
    }

    // ドラッグ＆ドロップ（セル入れ替え）のイベント設定
    setupCellDragDrop(cell, index);

    grid.appendChild(cell);
  });

  area.appendChild(grid);
}

/**
 * 画像入りのセルを構築する
 * @param {HTMLElement} cell セル要素
 * @param {number} index 画像インデックス
 */
function createImageCell(cell, index) {
  const img = images[index];

  // 画像コンテナ（overflow:hidden で「枠の中で動かす」動作）
  const container = document.createElement('div');
  container.className = 'cell-image-container';
  container.dataset.index = index;

  // 画像要素
  const imgEl = document.createElement('img');
  imgEl.className = 'cell-image';
  imgEl.draggable = false; // ブラウザのデフォルトドラッグを無効化

  // 画像読み込み後に位置・サイズを適用
  // requestAnimationFrame を2回挟んで DOM レイアウトが確定してから計算する
  imgEl.onload = () => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        applyTransform(container, imgEl, index);
      });
    });
  };

  // src を最後に設定（onload を確実に発火させるため）
  imgEl.src = img.url;

  container.appendChild(imgEl);

  // 枠内での画像パン（ドラッグ移動）イベント
  setupImagePan(container, index);

  // オーバーレイ（ホバー時コントロール）
  const overlay = document.createElement('div');
  overlay.className = 'cell-overlay';

  const controls = document.createElement('div');
  controls.className = 'cell-controls';
  controls.innerHTML = `
    <button class="cell-ctrl-btn" title="詳細調整" onclick="openEditPanel(${index})">⚙️</button>
  `;

  overlay.appendChild(controls);
  cell.appendChild(container);
  cell.appendChild(overlay);
}

/**
 * セルの画像に変換（スケール・オフセット）を適用する
 * 「枠いっぱいに画像を表示しつつ、ユーザーが位置・ズームを変えられる」動作の核心
 *
 * @param {HTMLElement} container 画像コンテナ（overflow:hidden）
 * @param {HTMLImageElement} imgEl 画像要素
 * @param {number} index 変換情報のインデックス
 */
function applyTransform(container, imgEl, index) {
  const transform = cellTransforms[index];
  const cw = container.offsetWidth;
  const ch = container.offsetHeight;
  const iw = imgEl.naturalWidth;
  const ih = imgEl.naturalHeight;

  if (!cw || !ch || !iw || !ih) return;

  // object-fit: cover 相当のベーススケールを計算
  const coverScale = Math.max(cw / iw, ch / ih);

  // ユーザーのズーム倍率を乗算
  const finalScale = coverScale * (transform.scale || 1);

  const scaledW = iw * finalScale;
  const scaledH = ih * finalScale;

  // 画像サイズ設定
  imgEl.style.width = scaledW + 'px';
  imgEl.style.height = scaledH + 'px';

  // ユーザーのオフセット（ピクセル単位、コンテナサイズに対する割合で管理）
  const maxOffsetX = (scaledW - cw) / 2;
  const maxOffsetY = (scaledH - ch) / 2;

  // offsetX/Y は -1〜1 の範囲で管理（1 = 端まで移動）
  const offsetPxX = (transform.offsetX || 0) * maxOffsetX;
  const offsetPxY = (transform.offsetY || 0) * maxOffsetY;

  // 中央配置 + オフセット
  const left = (cw - scaledW) / 2 + offsetPxX;
  const top = (ch - scaledH) / 2 + offsetPxY;

  imgEl.style.left = left + 'px';
  imgEl.style.top = top + 'px';
}

// =========================================================
// 画像パン（枠内ドラッグ移動）
// =========================================================

/**
 * コンテナ内での画像パン（位置移動）イベントを設定する
 * マウスとタッチの両方に対応
 */
function setupImagePan(container, index) {
  let startX, startY, startOX, startOY, isPanning = false;

  function onStart(e) {
    // セルの入れ替えドラッグと競合しないよう、셀レベルのdragstartとは分離している
    // ただしポインタイベントを使い、入れ替えボタンを押したときは無視する
    if (e.target.classList.contains('cell-ctrl-btn')) return;
    isPanning = true;

    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX;
    startY = pt.clientY;
    startOX = cellTransforms[index].offsetX || 0;
    startOY = cellTransforms[index].offsetY || 0;

    e.preventDefault();
    e.stopPropagation(); // セルDnDへの伝播を止める
  }

  function onMove(e) {
    if (!isPanning) return;
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;

    const imgEl = container.querySelector('.cell-image');
    if (!imgEl) return;

    const cw = container.offsetWidth;
    const ch = container.offsetHeight;
    const scaledW = parseFloat(imgEl.style.width) || cw;
    const scaledH = parseFloat(imgEl.style.height) || ch;

    const maxOffsetX = Math.max(0, (scaledW - cw) / 2);
    const maxOffsetY = Math.max(0, (scaledH - ch) / 2);

    // ピクセルを -1〜1 の正規化された値に変換
    const newOX = maxOffsetX > 0 ? Math.max(-1, Math.min(1, startOX + dx / maxOffsetX)) : 0;
    const newOY = maxOffsetY > 0 ? Math.max(-1, Math.min(1, startOY + dy / maxOffsetY)) : 0;

    cellTransforms[index].offsetX = newOX;
    cellTransforms[index].offsetY = newOY;

    applyTransform(container, imgEl, index);
  }

  function onEnd() {
    isPanning = false;
  }

  container.addEventListener('mousedown', onStart);
  container.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
}

// =========================================================
// セルのドラッグ＆ドロップ（コマ入れ替え）
// =========================================================

let dragSourceIndex = -1; // ドラッグ元のセルインデックス

/**
 * セルのドラッグ＆ドロップによる並び替えイベントを設定する
 */
function setupCellDragDrop(cell, index) {
  cell.draggable = true;

  cell.addEventListener('dragstart', (e) => {
    dragSourceIndex = index;
    cell.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    // ゴーストを小さくしたい場合はここで設定
  });

  cell.addEventListener('dragend', () => {
    cell.classList.remove('dragging');
    document.querySelectorAll('.collage-cell').forEach(c => c.classList.remove('drag-target'));
    dragSourceIndex = -1;
  });

  cell.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (dragSourceIndex !== index) {
      cell.classList.add('drag-target');
    }
  });

  cell.addEventListener('dragleave', () => {
    cell.classList.remove('drag-target');
  });

  cell.addEventListener('drop', (e) => {
    e.preventDefault();
    cell.classList.remove('drag-target');

    if (dragSourceIndex !== -1 && dragSourceIndex !== index) {
      // 画像データと変換情報をスワップ
      [images[dragSourceIndex], images[index]] = [images[index], images[dragSourceIndex]];
      [cellTransforms[dragSourceIndex], cellTransforms[index]] = [cellTransforms[index], cellTransforms[dragSourceIndex]];
      renderCollage();
      showToast('画像を入れ替えました');
    }
  });
}

// =========================================================
// 編集パネル（ズーム・位置）
// =========================================================

/** 編集パネルを開く */
function openEditPanel(index) {
  editingCellIndex = index;
  const t = cellTransforms[index];

  // スライダーの値を同期
  document.getElementById('scaleSlider').value = Math.round((t.scale || 1) * 100);
  document.getElementById('scaleLabel').textContent = Math.round((t.scale || 1) * 100) + '%';
  document.getElementById('xSlider').value = Math.round((t.offsetX || 0) * 100);
  document.getElementById('ySlider').value = Math.round((t.offsetY || 0) * 100);
  document.getElementById('xLabel').textContent = formatOffset(t.offsetX);
  document.getElementById('yLabel').textContent = formatOffset(t.offsetY);

  document.getElementById('editPanel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

/** 編集パネルを閉じる */
function closeEditPanel() {
  document.getElementById('editPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  editingCellIndex = -1;
}

/** スケールスライダーの変更 */
function updateCellScale(value) {
  if (editingCellIndex < 0) return;
  const scale = parseInt(value) / 100;
  cellTransforms[editingCellIndex].scale = scale;
  document.getElementById('scaleLabel').textContent = value + '%';
  applyTransformByIndex(editingCellIndex);
}

/** X方向スライダーの変更 */
function updateCellX(value) {
  if (editingCellIndex < 0) return;
  cellTransforms[editingCellIndex].offsetX = parseInt(value) / 100;
  document.getElementById('xLabel').textContent = formatOffset(parseInt(value) / 100);
  applyTransformByIndex(editingCellIndex);
}

/** Y方向スライダーの変更 */
function updateCellY(value) {
  if (editingCellIndex < 0) return;
  cellTransforms[editingCellIndex].offsetY = parseInt(value) / 100;
  document.getElementById('yLabel').textContent = formatOffset(parseInt(value) / 100);
  applyTransformByIndex(editingCellIndex);
}

/** 変換情報をリセット */
function resetCellTransform() {
  if (editingCellIndex < 0) return;
  cellTransforms[editingCellIndex] = { scale: 1, offsetX: 0, offsetY: 0 };
  document.getElementById('scaleSlider').value = 100;
  document.getElementById('scaleLabel').textContent = '100%';
  document.getElementById('xSlider').value = 0;
  document.getElementById('xLabel').textContent = '中央';
  document.getElementById('ySlider').value = 0;
  document.getElementById('yLabel').textContent = '中央';
  applyTransformByIndex(editingCellIndex);
}

/** セルインデックスを使って transform を再適用 */
function applyTransformByIndex(index) {
  const container = document.querySelector(`.cell-image-container[data-index="${index}"]`);
  if (!container) return;
  const imgEl = container.querySelector('.cell-image');
  if (!imgEl) return;

  // レイアウト確定を待ってから適用
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      applyTransform(container, imgEl, index);
    });
  });
}

/** オフセット値の表示文字列変換 */
function formatOffset(val) {
  val = val || 0;
  if (Math.abs(val) < 0.02) return '中央';
  return val > 0 ? `右/下 ${Math.round(val*100)}%` : `左/上 ${Math.round(Math.abs(val)*100)}%`;
}

// =========================================================
// デザイン設定
// =========================================================

/** 背景色を設定する */
function setBgColor(color, swatchEl) {
  document.documentElement.style.setProperty('--bg-color', color);
  document.getElementById('bgColorPicker').value = color;

  // スウォッチのアクティブ状態を更新
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  if (swatchEl) swatchEl.classList.add('active');

  // コラージュのグリッドにも即時反映
  const grid = document.querySelector('.collage-grid');
  if (grid) grid.style.background = color;
  const area = document.getElementById('collage-area');
  if (area) area.style.background = color;
}

/** ギャップ（コマ間隔）を更新する */
function updateGap(value) {
  const gap = value + 'px';
  document.documentElement.style.setProperty('--gap', gap);
  const grid = document.querySelector('.collage-grid');
  if (grid) {
    grid.style.gap = gap;
    grid.style.padding = gap;
  }
}

/** 枠線トグル */
function updateBorder() {
  const on = document.getElementById('borderToggle').checked;
  document.getElementById('borderControls').style.display = on ? '' : 'none';

  if (on) {
    const size = document.getElementById('borderSizeSelect').value;
    const color = document.getElementById('borderColorPicker').value;
    setBorderStyle(size, color);
  } else {
    document.documentElement.style.setProperty('--border-size', '0px');
    document.querySelectorAll('.collage-cell').forEach(cell => {
      cell.style.border = '';
    });
  }
}

function updateBorderColor(color) {
  document.documentElement.style.setProperty('--border-color', color);
  document.querySelectorAll('.collage-cell').forEach(cell => {
    cell.style.borderColor = color;
  });
}

function updateBorderSize(value) {
  document.documentElement.style.setProperty('--border-size', value + 'px');
  const color = document.getElementById('borderColorPicker').value;
  setBorderStyle(value, color);
}

function setBorderStyle(size, color) {
  document.documentElement.style.setProperty('--border-size', size + 'px');
  document.documentElement.style.setProperty('--border-color', color);
  document.querySelectorAll('.collage-cell').forEach(cell => {
    cell.style.border = `${size}px solid ${color}`;
  });
}

/** 出力アスペクト比を設定する */
function setRatio(ratio, btn) {
  currentRatio = ratio;
  document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCollage();
}

// =========================================================
// ダウンロード
// =========================================================

/**
 * コラージュをダウンロードする
 * html2canvas でコラージュエリアを画像化する
 * @param {string} format 'png' or 'jpeg'
 */
async function downloadCollage(format) {
  const area = document.getElementById('collage-area');
  if (!area) return;

  showToast('画像を生成中...');

  try {
    const canvas = await html2canvas(area, {
      scale: EXPORT_SCALE,           // 高解像度出力
      useCORS: true,
      allowTaint: true,
      backgroundColor: getComputedStyle(document.documentElement)
                         .getPropertyValue('--bg-color').trim() || '#ffffff',
      logging: false
    });

    // Canvas を Blob に変換してダウンロード
    canvas.toBlob((blob) => {
      if (!blob) {
        showToast('エラー: 画像の生成に失敗しました');
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `collage_${Date.now()}.${format === 'jpeg' ? 'jpg' : 'png'}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('ダウンロードしました！');
    }, `image/${format}`, format === 'jpeg' ? 0.92 : undefined);

  } catch (err) {
    console.error('ダウンロードエラー:', err);
    showToast('エラー: 画像の生成に失敗しました');
  }
}

// =========================================================
// トースト通知
// =========================================================

let toastTimer = null;

/**
 * 画面下部にトーストメッセージを表示する
 * @param {string} message 表示するメッセージ
 * @param {number} duration 表示時間 (ms)
 */
function showToast(message, duration = 2500) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

// =========================================================
// ウィンドウリサイズへの対応
// =========================================================

// リサイズ時にコラージュを再描画（サイズを再計算）
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (currentLayout) renderCollage();
  }, 200);
});

</script>
